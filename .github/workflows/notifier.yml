name: BoligPortal Notifier

# Schedule times are in UTC — GitHub Actions has no timezone-aware cron.
# Denmark is UTC+2 in summer (CEST) and UTC+1 in winter (CET). This
# targets roughly 6:45am, 12:07pm, 4:07pm, 8:07pm Copenhagen time
# during CEST (summer). When DST ends in late October, shift each
# hour back by one (3:45, 9:07, 13:07, 17:07 UTC) to keep hitting the
# same local times.
#
# Off-beat minutes (:45 / :07 instead of :00) are deliberate — GitHub
# Actions gets a surge of scheduled jobs at round hours from every
# repo doing the same thing, which causes queue delays. Off-beat
# minutes avoid most of that congestion.
on:
  schedule:
    - cron: '45 4 * * *'
    - cron: '7 10,14,18 * * *'
  workflow_dispatch:  # lets you trigger a run manually from the Actions tab, for testing

permissions:
  contents: write  # needed to commit the updated seen_ids.json back to the repo

jobs:
  check-listings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests openpyxl

      - name: Write email config from secrets
        run: |
          cat > email_config.json << EOF
          {
            "smtp_server": "smtp.gmail.com",
            "smtp_port": 465,
            "sender": "${{ secrets.GMAIL_SENDER }}",
            "app_password": "${{ secrets.GMAIL_APP_PASSWORD }}",
            "recipient": ${{ secrets.GMAIL_RECIPIENTS_JSON }}
          }
          EOF

      - name: Run notifier
        run: python3 daily_notifier.py

      - name: Commit updated seen_ids.json
        run: |
          git config user.name "boligportal-bot"
          git config user.email "actions@github.com"
          git add data/seen_ids.json
          git diff --staged --quiet || git commit -m "Update seen listings"
          git push